[project]
name = "photo-cull"
version = "0.1.0"
description = "A cli photo culling application with llm and decision model escalation."
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "Chase Kelly", email = "188378569+EquilOne@users.noreply.github.com" }]
dependencies = []

[project.scripts]
photo-cull = "photo_cull:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.6",
    "ty>=0.0.109",
]

[tool.ruff]
line-length = 88
target-version = "py313"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ty.environment]
python-version = "3.13"
